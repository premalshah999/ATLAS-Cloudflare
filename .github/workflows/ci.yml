name: CI
on:
  push: { branches: [main, 'claude/**'] }
  pull_request:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - name: OS sandbox and desktop tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap xvfb xdotool x11-utils imagemagick mono-mcs
          # Ubuntu 24.04 restricts unprivileged user namespaces; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Desktop tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install xdotool
          echo /opt/X11/bin >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Browser for QA checks
        run: pnpm exec playwright install chromium
      - name: Windows sandbox accounts (ADR 0020)
        if: runner.os == 'Windows'
        run: pnpm exec vite-node scripts/win-sandbox.ts setup
      - run: pnpm doctor
      - run: pnpm pi:version
      - if: success() || failure()
        run: pnpm lint
      - if: success() || failure()
        run: pnpm typecheck
      - if: success() || failure()
        run: pnpm test
        env: { ATLAS_REQUIRE_DESKTOP: "${{ runner.os != 'Windows' && '1' || '' }}", ATLAS_EXPECT_WINDOWS_ACCOUNTS: "${{ runner.os == 'Windows' && '1' || '' }}" }
      - if: success() || failure()
        run: pnpm test:integration
        env: { ATLAS_REQUIRE_DESKTOP: "${{ runner.os != 'Windows' && '1' || '' }}" }
      - if: success() || failure()
        run: ATLAS_EVAL_OUT=evals/out pnpm eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-${{ matrix.os }}
          path: evals/out
      - if: success() || failure()
        name: Electron e2e
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}pnpm test:e2e
      - if: success() || failure()
        name: Package
        run: pnpm package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
